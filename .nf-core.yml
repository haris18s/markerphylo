repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-markerphylo_logo_light.png
    - docs/images/nf-core-markerphylo_logo_light.png
    - docs/images/nf-core-markerphylo_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-markerphylo_logo_light.png
    - docs/images/nf-core-markerphylo_logo_light.png
    - docs/images/nf-core-markerphylo_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: haris18s
  name: MarkerPhylo
  description: 'Reproducible marker-based phylogenomic pipeline: from genome accessions
    or assemblies to a species tree, with QC, marker identification, alignment and
    tree inference.'
  author: haris18s
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - gpu
  is_nfcore: false
